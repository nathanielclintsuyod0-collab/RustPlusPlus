[package]
name = "rust-plus-plus"
version = "0.2.0"
edition = "2021"
description = "Rust++ deterministic offline coding assistant engine"
license = "MIT"

[lib]
name = "rust_plus_plus"
path = "src/lib.rs"

[[bin]]
name = "rust-plus-plus-cli"
path = "src/main.rs"
required-features = ["discord"]

[features]
default = []
discord = ["dep:serenity", "dep:tokio"]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"], optional = true }
serenity = { version = "0.12", default-features = false, features = ["client", "gateway", "model", "rustls_backend"], optional = true }
