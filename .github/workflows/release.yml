name: Build Rust++ for Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download bundled GCC toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path "src-tauri/binaries/cpp" | Out-Null
          curl.exe -L --fail --retry 3 --output gcc.zip "https://sourceforge.net/projects/winlibs-mingw/files/16.2.0posix-14.0.0-ucrt-r2/winlibs-x86_64-posix-seh-gcc-16.2.0-mingw-w64ucrt-14.0.0-r2.zip/download"
          if ($LASTEXITCODE -ne 0) { throw "GCC download failed" }
          Expand-Archive -Path "gcc.zip" -DestinationPath "src-tauri/binaries/cpp" -Force
          Remove-Item "gcc.zip"
          if (!(Test-Path "src-tauri/binaries/cpp/mingw64/bin/g++.exe")) { throw "g++.exe was not found after extraction" }

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Windows installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.1.0' }}
          releaseName: Rust++ ${{ github.ref_type == 'tag' && github.ref_name || 'v0.1.0' }}
          releaseBody: |
            Rust++ Windows release.

            Offline coding assistant supporting C++, Rust, Python, JavaScript, Java, and C#.
          releaseDraft: true
          prerelease: false
          args: --bundles nsis,msi
